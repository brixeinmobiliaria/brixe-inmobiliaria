[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/privacidad"
  to = "/aviso-de-privacidad.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200
